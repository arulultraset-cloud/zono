<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZONO - Videos</title>
<style>
body{margin:0;background:#101010;color:white;font-family:Arial}
header{background:#222;padding:15px;display:flex;gap:12px;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#ff3434}
button{padding:10px;border:0;border-radius:7px;cursor:pointer;margin:4px}
input,textarea{display:block;width:95%;padding:12px;margin:10px 0;background:#292929;color:white;border:1px solid #555;border-radius:7px}
main{padding:15px}
.panel,.video{background:#202020;padding:14px;margin:12px 0;border-radius:10px}
.video video{width:100%;max-height:350px}
.hidden{display:none}
#status{color:#ffd166;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<div class="logo">ZONO</div>
<span>Watch · Share · Connect</span>
</header>

<main>
<h2>Welcome to ZONO</h2>

<div class="panel" id="account">
<h3>Login / Create Account</h3>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (6 characters minimum)">
<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>
<button onclick="logout()">Logout</button>
</div>

<div class="panel hidden" id="upload">
<h3>Upload Video</h3>
<input id="title" placeholder="Video title">
<textarea id="description" placeholder="Video description"></textarea>
<input id="file" type="file" accept="video/*">
<button onclick="uploadVideo()">Upload</button>
<p>Free upload limit: 50 MB per video.</p>
</div>

<h2>ZONO Videos</h2>
<div id="videos"></div>
<p id="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL = "https://crzxuxcffqgrqntjrxod.supabase.co";
const KEY = "sb_publishable_Kxsql_aPZEknvC2mEHEG1Q_jt_gVFzj";
const db = window.supabase.createClient(URL, KEY);
let user = null;

function msg(t){
  document.getElementById("status").textContent=t;
}

async function signup(){
  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || password.length < 6) {
      msg("Enter email and a password of at least 6 characters.");
      return;
    }

    msg("Creating account...");

    const { data, error } = await db.auth.signUp({ email, password });

    if (error) {
      msg("Signup error: " + error.message);
      return;
    }

    msg("Account request sent. Check email if confirmation is required.");
  } catch (e) {
    msg("Signup error: " + e.message);
  }
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){msg(error.message);return;}
  user=data.user;
  await refresh();
  msg("Login successful!");
}

async function logout(){
  const {error}=await db.auth.signOut();
  if(error){msg(error.message);return;}
  user=null;
  document.getElementById("upload").classList.add("hidden");
  document.getElementById("videos").innerHTML="";
  msg("Logged out.");
}

async function uploadVideo(){
  if(!user){msg("Please log in first.");return;}
  const file=document.getElementById("file").files[0];
  const title=document.getElementById("title").value.trim();
  const description=document.getElementById("description").value.trim();

  if(!file || !file.type.startsWith("video/") || !title){
    msg("Choose a video and enter its title.");
    return;
  }
  if(file.size>50*1024*1024){
    msg("Video is over 50 MB. Choose a smaller video.");
    return;
  }

  const path=user.id+"/"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  msg("Uploading video. Please wait...");

  const {error:upError}=await db.storage.from("zono-videos")
    .upload(path,file,{contentType:file.type,upsert:false});

  if(upError){msg("Upload error: "+upError.message);return;}

  const {error:dbError}=await db.from("videos").insert({
    user_id:user.id,
    title:title,
    description:description,
    video_url:path
  });

  if(dbError){msg("Video uploaded, but details could not be saved: "+dbError.message);return;}

  document.getElementById("title").value="";
  document.getElementById("description").value="";
  document.getElementById("file").value="";
  msg("Video uploaded!");
  await loadVideos();
}

async function loadVideos(){
  const area=document.getElementById("videos");
  area.innerHTML="";
  const {data,error}=await db.from("videos")
    .select("title,description,video_url,created_at")
    .order("created_at",{ascending:false});

  if(error){msg("Video list error: "+error.message);return;}

  if(!data || !data.length){
    area.textContent="No videos uploaded yet.";
    return;
  }

  for(const v of data){
    const {data:signed,error:signError}=await db.storage
      .from("zono-videos").createSignedUrl(v.video_url,3600);
    if(signError) continue;

    const card=document.createElement("div");
    card.className="video";
    const player=document.createElement("video");
    player.controls=true;
    player.preload="metadata";
    player.src=signed.signedUrl;
    const heading=document.createElement("h3");
    heading.textContent=v.title||"ZONO Video";
    const desc=document.createElement("p");
    desc.textContent=v.description||"";
    card.append(player,heading,desc);
    area.appendChild(card);
  }
}

async function refresh(){
  document.getElementById("upload").classList.toggle("hidden",!user);
  if(user) await loadVideos();
}

async function start(){
  if(KEY==="YOUR_PUBLISHABLE_KEY"){
    msg("Setup needed: add your Supabase Publishable Key in the code.");
    return;
  }
  const {data}=await db.auth.getSession();
  user=data.session ? data.session.user : null;
  await refresh();
  db.auth.onAuthStateChange((_event,session)=>{
    user=session ? session.user : null;
    refresh();
  });
}
start();
</script>
</body>
</html>
